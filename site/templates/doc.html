<!DOCTYPE html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ · zhanlang</title>
<script src="$root$assets/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="$root$assets/theme.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="$root$"><span class="tri">▲</span>zhanlang</a>
  <div class="links">
    <a href="$root$spec/">Spec</a>
    <a href="$root$white-paper/">Whitepaper</a>
    <a href="$root$play/">Playground</a>
    <a href="https://github.com/JunyuZhan/zhanlang">GitHub</a>
  </div>
  <div class="spacer"></div>
  <button class="theme-toggle" data-theme-toggle onclick="__zhanlangToggleTheme()" aria-label="切换主题">🌙</button>
  <a href="$switch-url$">$switch-label$</a>
</nav>
<div class="doc-layout">
$if(toc)$
<aside class="doc-toc">
  <div class="toc-title">目录</div>
  $toc$
</aside>
$endif$
<article class="doc-content">
$body$
</article>
</div>
<footer class="footer">
  <a href="https://github.com/JunyuZhan/zhanlang">GitHub repository</a>
  <span>Synced from <a href="https://github.com/JunyuZhan/zhanlang">origin/main</a></span>
</footer>
</body>
</html>
