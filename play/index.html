<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · zhanlang</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="../"><span class="tri">▲</span>zhanlang</a>
  <div class="links">
    <a href="../spec/">Spec</a>
    <a href="../white-paper/">Whitepaper</a>
    <a href="./">Playground</a>
    <a href="https://github.com/JunyuZhan/zhanlang">GitHub</a>
  </div>
  <div class="spacer"></div>
  <a href="../zh/play/">中文</a>
  <span id="play-status" class="eyebrow" style="margin:0"></span>
</nav>
<main>
  <div class="play-layout">
    <div class="play-pane">
      <label for="example-select">Examples</label>
      <select id="example-select" class="play-select"></select>
      <label for="editor">zhanlang source</label>
      <textarea id="editor" class="play-editor" spellcheck="false"></textarea>
    </div>
    <div class="play-pane">
      <label>Result</label>
      <pre id="output" class="play-output">Loading…</pre>
    </div>
  </div>
</main>
<script type="module" src="../assets/play.js"></script>
</body>
</html>
